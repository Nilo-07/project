<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple CRUD App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ea2020;
      padding: 20px;
   
    }

    .card {
      background: #fff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    input, button {
      padding: 8px;
      margin: 5px 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #eee;
    }

    .message {
      margin-top: 10px;
      font-size: 14px;
    }

    .success {
      color: green;
    }
    .error {
      color: red;
    }

    .actions button {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h1>CRUD Demo – Items</h1>

  <div class="card">
    <h2>Create / Update Item</h2>

    <input type="hidden" id="itemId" />

    <label>Name*</label>
    <input type="text" id="name" placeholder="Item name" />

    <label>Description</label>
    <input type="text" id="description" placeholder="Item description" />

    <label>Quantity</label>
    <input type="number" id="quantity" placeholder="0" min="0" />

    <button id="saveBtn" onclick="saveItem()">Save Item</button>
    <button onclick="resetForm()">Clear Form</button>

    <div id="formMessage" class="message"></div>
  </div>

  <div class="card">
    <h2>Items List</h2>
    <button onclick="getItems()">Refresh List</button>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Quantity</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="itemsTableBody"></tbody>
    </table>
    <div id="listMessage" class="message"></div>
  </div>

  <script>
   const API_URL = "http://localhost:5001/api/items";


    const itemIdInput = document.getElementById("itemId");
    const nameInput = document.getElementById("name");
    const descInput = document.getElementById("description");
    const qtyInput = document.getElementById("quantity");
    const formMessage = document.getElementById("formMessage");
    const listMessage = document.getElementById("listMessage");
    const saveBtn = document.getElementById("saveBtn");
    const tableBody = document.getElementById("itemsTableBody");

    // Load items on page load
    window.onload = () => {
      getItems();
    };

    function showFormMessage(text, isError = false) {
      formMessage.textContent = text;
      formMessage.className = "message " + (isError ? "error" : "success");
    }

    function showListMessage(text, isError = false) {
      listMessage.textContent = text;
      listMessage.className = "message " + (isError ? "error" : "success");
    }

    function resetForm() {
      itemIdInput.value = "";
      nameInput.value = "";
      descInput.value = "";
      qtyInput.value = "";
      saveBtn.textContent = "Save Item";
      showFormMessage("");
    }

    async function saveItem() {
      const id = itemIdInput.value;
      const name = nameInput.value.trim();
      const description = descInput.value.trim();
      const quantity = Number(qtyInput.value || 0);

      if (!name) {
        showFormMessage("Name is required", true);
        return;
      }
      if (quantity < 0) {
        showFormMessage("Quantity cannot be negative", true);
        return;
      }

      saveBtn.disabled = true;
      showFormMessage("Saving...");

      try {
        const method = id ? "PUT" : "POST";
        const url = id ? `${API_URL}/${id}` : API_URL;

        const res = await fetch(url, {
          method,
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ name, description, quantity }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || "Failed to save item");
        }

        const data = await res.json();
        showFormMessage(id ? "Item updated successfully" : "Item created successfully");
        resetForm();
        getItems();
      } catch (error) {
        console.error(error);
        showFormMessage(error.message, true);
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function getItems() {
      showListMessage("Loading items...");
      tableBody.innerHTML = "";

      try {
        const res = await fetch(API_URL);
        if (!res.ok) {
          throw new Error("Failed to fetch items");
        }
        const items = await res.json();

        if (!items.length) {
          showListMessage("No items found yet.");
          return;
        }

        showListMessage("");
        items.forEach((item) => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.description || ""}</td>
            <td>${item.quantity ?? 0}</td>
            <td class="actions">
              <button onclick="editItem('${item._id}')">Edit</button>
              <button onclick="deleteItem('${item._id}')">Delete</button>
            </td>
          `;

          tableBody.appendChild(tr);
        });
      } catch (error) {
        console.error(error);
        showListMessage(error.message, true);
      }
    }

    async function editItem(id) {
      try {
        const res = await fetch(`${API_URL}/${id}`);
        if (!res.ok) {
          throw new Error("Failed to fetch item");
        }
        const item = await res.json();

        itemIdInput.value = item._id;
        nameInput.value = item.name;
        descInput.value = item.description || "";
        qtyInput.value = item.quantity ?? 0;
        saveBtn.textContent = "Update Item";
        showFormMessage("Editing item...");
      } catch (error) {
        console.error(error);
        showFormMessage(error.message, true);
      }
    }

    async function deleteItem(id) {
      const confirmed = confirm("Are you sure you want to delete this item?");
      if (!confirmed) return;

      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: "DELETE",
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || "Failed to delete item");
        }

        showListMessage("Item deleted successfully");
        getItems();
      } catch (error) {
        console.error(error);
        showListMessage(error.message, true);
      }
    }
  </script>
</body>
</html>
